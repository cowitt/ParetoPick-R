name: Zenodo Release

on:
  release:
    types: [published]

jobs:
  zenodo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create archive
        run: |
          zip -r release.zip . -x "*.git*"

      - name: Upload to Zenodo
        uses: rseng/zenodo-release@main
        with:
          token: ${{ secrets.ZENODO_TOKEN }}
          version: ${{ github.ref_name }}
          zenodo_json: .zenodo.json
          archive: release.zip